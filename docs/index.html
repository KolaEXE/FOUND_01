function lg(f,m,im,it){const e=document.getElementById('lg');if(!e)return;const d=document.createElement('div'),t=document.createElement('span'),n=document.createElement('b'),x=document.createElement('span');t.textContent=G2.t.toFixed(1).padStart(5)+'s ';t.style.opacity='.5';n.textContent=f.c.n+' ';n.style.color=f.c.c;x.textContent=m;if(im){d.style.fontWeight='bold';d.style.color='#ffcc33'}if(it)d.style.fontStyle='italic';d.append(t,n,x);e.prepend(d);while(e.childElementCount>90)e.lastChild.remove()}
